name: Show & Sell Catalog Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Build product catalog
        shell: bash
        run: |
          set -e

          rm -rf generated-catalog catalog-output
          mkdir -p generated-catalog catalog-output

          cat > generated-catalog/catalog.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>LIBAS ATELIER — Luxury Catalog Hub</title>
            <style>
              * { box-sizing: border-box; }

              body {
                margin: 0;
                padding: 0;
                background: #111;
                color: #fff;
                font-family: Arial, Helvetica, sans-serif;
              }

              .container {
                width: 100%;
                max-width: 1100px;
                margin: 0 auto;
                padding: 35px 20px 60px;
              }

              h1 {
                margin: 0 0 12px;
                font-size: clamp(38px, 7vw, 76px);
                font-weight: 800;
                letter-spacing: 2px;
              }

              .subtitle {
                margin-bottom: 45px;
                font-size: clamp(24px, 4vw, 42px);
                font-weight: 600;
              }

              .product {
                margin-bottom: 55px;
                padding-bottom: 45px;
                border-bottom: 2px solid #444;
              }

              .product h2 {
                margin: 0 0 25px;
                font-size: clamp(30px, 5vw, 54px);
                font-weight: 800;
              }

              .product img {
                display: block;
                width: 100%;
                max-width: 900px;
                height: auto;
                margin: 0 auto;
                border-radius: 12px;
                background: #222;
              }

              .count {
                margin-top: 35px;
                font-size: clamp(22px, 4vw, 34px);
                font-weight: 700;
              }
            </style>
          </head>

          <body>
            <div class="container">
              <h1>LIBAS ATELIER</h1>
              <div class="subtitle">Luxury Catalog Hub</div>
          HTML

          found=0

          mapfile -t files < <(
            find . -maxdepth 1 -type f \
              \( -iname 'LA-*.jpg' -o \
                 -iname 'LA-*.jpeg' -o \
                 -iname 'LA-*.png' -o \
                 -iname 'LA-*.webp' \) \
              -printf '%f\n' |
            sort -V
          )

          for file in "${files[@]}"; do

            [ -f "$file" ] || continue

            sku="${file%.*}"

            case "${file##*.}" in
              jpg|JPG|jpeg|JPEG)
                mime="image/jpeg"
                ;;
              png|PNG)
                mime="image/png"
                ;;
              webp|WEBP)
                mime="image/webp"
                ;;
              *)
                continue
                ;;
            esac

            image_base64="$(base64 -w 0 "$file")"

            cat >> generated-catalog/catalog.html <<HTML
              <section class="product">
                <h2>${sku}</h2>
                <img src="data:${mime};base64,${image_base64}" alt="${sku}">
              </section>
          HTML

            cp "$file" generated-catalog/
            found=$((found + 1))

          done

          cat >> generated-catalog/catalog.html <<HTML
              <div class="count">
                Products detected: ${found}
              </div>
            </div>
          </body>
          </html>
          HTML

          cp generated-catalog/catalog.html catalog-output/

          for file in generated-catalog/LA-*; do
            [ -f "$file" ] || continue
            cp "$file" catalog-output/
          done

          echo "TOTAL PRODUCTS DETECTED: $found"

      - name: Upload catalog package
        uses: actions/upload-artifact@v4
        with:
          name: show-and-sell-catalog
          path: catalog-output/
